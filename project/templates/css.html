        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #2c4cdb 100%);
            border: none;
            padding: 8px 20px;
        }

        .chat-section {
            padding: 60px 0;
            min-height: calc(100vh - 200px);
        }

        .chat-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            height: 50rem;

            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #2c4cdb 100%);
            color: white;
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .chat-header-icon {
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .chat-header-text h3 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
        }

        .chat-header-text p {
            margin: 5px 0 0 0;
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 18px;
            color: white;
        }

        .message.bot .message-avatar {
            background: linear-gradient(135deg, #2c4cdb 0%, #2c4cdb 100%);
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #a3f1f7 0%, #a3f1f7 100%);
        }

        .message-content {
            max-width: 70%;
            padding-left: 2rem;
            padding-right: 2rem;
            margin-right: 20px;
            /* padding-bottom: 1rem;
            padding-top: 1rem; */
            border-radius: 1rem;
            line-height: 1.6;
            font-size: 1rem;
            float: left;
        }

        .message-content-user {
            max-width: 100%;
            /* padding-bottom: 1rem;
            padding-top: 1rem; */
            border-radius: 1rem;
            line-height: 1.6;
            font-size: 1rem;
            float: left;
        }

        .message.bot .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #2c4cdb 100%);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
            width: 300px;
            height: 50px;
            padding-top: 10px;
        }


        .message.bot .message-content-user {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .message.user .message-content-user {
            background: linear-gradient(135deg, #667eea 0%, #2c4cdb 100%);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
        }

        .message-time {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 5px;
            margin-left: 100px;
        }

        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 15px 25px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
        }

        .quick-reply-btn {
            padding: 10px 16px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 20px;
            color: #667eea;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .quick-reply-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .chat-input-container {
            padding: 20px 25px;
            width: 100%;
            background: white;
            border-top: 1px solid #e9ecef;
            display: flex;
            gap: 12px;
        }

        .chat-input {
            flex: 1;
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .send-button {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #2c4cdb 100%);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .send-button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .send-button:active {
            transform: scale(0.95);
        }

        .voice-button {
            width: 50px;
            height: 50px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 50%;
            color: #667eea;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .voice-button:hover {
            background: #667eea;
            color: white;
            transform: scale(1.05);
        }

        .voice-button.active {
            background: #f5576c;
            border-color: #f5576c;
            color: white;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .speaker-button {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            background: rgba(102, 126, 234, 0.1);
            border: none;
            border-radius: 50%;
            color: #667eea;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .speaker-button:hover {
            background: #667eea;
            color: white;
        }

        .speaker-button.speaking {
            background: #667eea;
            color: white;
            animation: pulse 1s infinite;
        }

        .message > div {
            position: relative;
        }



        .attachment-button {
            width: 50px;
            height: 50px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 50%;
            color: #667eea;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .attachment-button:hover {
            background: #667eea;
            color: white;
            transform: scale(1.05);
        }

        .attachment-button.uploading {
            background: #ff9800;
            border-color: #ff9800;
            color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .file-input {
            display: none;
        }

        .file-preview {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            background: #e3f2fd;
            border-radius: 12px;
            margin-top: 10px;
            font-size: 14px;
        }

        .file-preview-icon {
            color: #667eea;
            font-size: 20px;
        }

        .file-preview-name {
            flex: 1;
            color: #333;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-preview-remove {
            color: #f5576c;
            cursor: pointer;
            font-size: 18px;
        }

        .message-content.file-message {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .file-icon-large {
            font-size: 24px;
            color: #667eea;
        }




        .typing-indicator {
            display: none;
            gap: 12px;
            padding: 10px 0;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-dots {
            display: flex;
            gap: 5px;
            padding: 15px 18px;
            background: white;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.5;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }
        .message-image {
            max-width: 300px;
            max-height: 300px;
            border-radius: 12px;
            margin-top: 10px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .message-image:hover {
            transform: scale(1.02);
        }

        .image-preview-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Image Modal */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            align-items: center;
            justify-content: center;
        }

        .image-modal.active {
            display: flex;
        }

        .image-modal-content {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .image-modal-close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            z-index: 2001;
        }

        .image-modal-close:hover {
            color: #f5576c;
        }
