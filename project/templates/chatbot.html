        const MAX_IMAGE_WIDTH = 224;
        const MAX_IMAGE_HEIGHT = 224;
        const IMAGE_QUALITY = 0.8;


        function resizeImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    const img = new Image();
                    
                    img.onload = function() {
                        // Calculate new dimensions while maintaining aspect ratio
                        let width = img.width;
                        let height = img.height;
                        
                        if (width > MAX_IMAGE_WIDTH || height > MAX_IMAGE_HEIGHT) {
                            const aspectRatio = width / height;
                            
                            if (width > height) {
                                width = MAX_IMAGE_WIDTH;
                                height = width / aspectRatio;
                            } else {
                                height = MAX_IMAGE_HEIGHT;
                                width = height * aspectRatio;
                            }
                        }
                        
                        // Create canvas and resize
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // Convert canvas to blob
                        canvas.toBlob(
                            function(blob) {
                                // Create new File object with same name
                                const resizedFile = new File([blob], file.name, {
                                    type: 'image/jpeg',
                                    lastModified: Date.now()
                                });
                                
                                console.log(`Original size: ${(file.size / 1024).toFixed(2)} KB`);
                                console.log(`Resized size: ${(resizedFile.size / 1024).toFixed(2)} KB`);
                                console.log(`Original dimensions: ${img.width}x${img.height}`);
                                console.log(`Resized dimensions: ${width}x${height}`);
                                
                                resolve(resizedFile);
                            },
                            'image/jpeg',
                            IMAGE_QUALITY
                        );
                    };
                    
                    img.onerror = function() {
                        reject(new Error('Failed to load image'));
                    };
                    
                    img.src = e.target.result;
                };
                
                reader.onerror = function() {
                    reject(new Error('Failed to read file'));
                };
                
                reader.readAsDataURL(file);
            });
        }

                utterance.rate = 0.9;
                utterance.pitch = 1;
                utterance.volume = 1;

                button.classList.add('speaking');

                utterance.onend = function() {
                    button.classList.remove('speaking');
                };

                utterance.onerror = function() {
                    button.classList.remove('speaking');
                };

                window.speechSynthesis.speak(utterance);
            } else {
                alert('Text-to-speech is not supported in your browser.');
            }

        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    // Remove the data URL prefix (e.g., "data:image/png;base64,")
                    const base64 = reader.result.split(',')[1];
                    resolve(base64);
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        async function sendMessageToUrl(userMessage) {

            if (questions.length == 0) {
        
                const url = '{{ chatbot }}';
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        mode: '{{ mode }}',
                        question: userMessage
                    })
                });
                

                const data = await response.json();
                answer=data.answer;
                if (data.questions) {
                    console.log(data.questions);
                    questions = data.questions;
                    answer=answer+"\n"+data.questions[0];
                    conv_id=data.conversation_id;
                }
                console.log(answer);
                return answer;
            }
            else if (questions.length != 0 && (answers.length != questions.length || answers )){
                answers.push(userMessage);
                console.log(userMessage);

                if (answers.length != questions.length){
                    console.log(questions[answers.length]);
                    // setTimeout(() => {
                        return questions[answers.length];
                    // },1500)
                }
            }
            if (questions.length != 0 && answers.length == questions.length){

                const answersObject = {};
                questions.forEach((question, index) => {
                    answersObject[question] = answers[index];
                });

                const url = '{{ chatbot }}';
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        question: "final",
                        conversation_id: conv_id,
                        answers:answersObject
                    })
                });
                questions=[];
                answers=[];
                conv_id="";
                const finalAnswer = await response.json();
                return finalAnswer.answer;
            }
            return null;
        }


        function getBotResponse(userMessage) {
            const lowerMessage = userMessage.toLowerCase();
            for (const key in responses) {
                if (lowerMessage.includes(key)) {
                    return responses[key];
                }
            }
            
            return responses['default'];
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (selectedFile) {
                sendFileMessage();
                return;
            }
            
            if (message === '') return;
            
            addMessage(message, true);
            input.value = '';
            
            showTypingIndicator();
            
            const botResponse = await sendMessageToUrl(message);
            removeTypingIndicator();

            addMessage(botResponse, false);

        }


        async function sendFileMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!selectedFile) return;
            
            const isImage = isImageFile(selectedFile.name);
            
            // Show user message with file/image
            if (isImage) {
                addMessage(message, true, true, filePreviewURL);
            } else {
                addMessage(`${message} - ${selectedFile.name}`, true, true);
            }
            
            // Show user message with file
            // addMessage(`${message} - ${selectedFile.name}`, true, true);
            input.value = '';
            
            showTypingIndicator();
            
            try {
                // Upload file to your backend
                const result = await uploadFile(selectedFile,message);
                removeFilePreview();

                
                removeTypingIndicator();
                
                // Display the response from your backend
                // Adjust this based on your backend response structure
                const botResponse = result.answer || result.response || 'File processed successfully!';
                addMessage(botResponse, false);
                
                // If your backend returns additional data, you can handle it here
                if (result.data) {
                    console.log('Additional data from backend:', result.data);
                }
                
            } catch (error) {
                removeTypingIndicator();
                addMessage('Sorry, there was an error processing your file. Please try again.', false);
                console.error('Error:', error);
            }
            
            selectedFile = null;
        }

            setTimeout(() => {
                removeTypingIndicator();
                const botResponse = getBotResponse(message);
                addMessage(botResponse, false);
            }, 1500);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
    
</body>
